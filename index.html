    <script>
      // Android Studio & WebView Guard:
      // Prevents "Cannot set property fetch of #<Window> which has only a getter"
      // and prevents Illegal invocation when WebView bridge or polyfills assign window.fetch
      (function() {
        try {
          var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn('[WebView Guard] Could not redefine window.fetch property descriptor', err);
        }
      })();
    </script>
